name: danka-pos
services:
  postgres:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_DB: pos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./bootstrap.sh:/docker-entrypoint-initdb.d/10-runtime-role.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pos']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    profiles: [extended]
    image: redis:7.4.11-bookworm
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: ['sh', '-c', 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes']
    ports: ['127.0.0.1:6379:6379']
    volumes: ['redis_data:/data']
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  object-storage:
    profiles: [extended]
    image: ghcr.io/versity/versitygw:v1.7.0
    environment:
      ROOT_ACCESS_KEY: ${S3_ROOT_USER:?Set S3_ROOT_USER}
      ROOT_SECRET_KEY: ${S3_ROOT_PASSWORD:?Set S3_ROOT_PASSWORD}
    command: ['--port', ':9000', 'posix', '/data']
    ports: ['127.0.0.1:9000:9000']
    volumes: ['object_data:/data']
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  object_data:

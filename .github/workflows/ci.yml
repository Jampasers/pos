name: Foundation CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: pos-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Install pinned pnpm and dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Types, domain/RLS tests and production builds
        run: |
          pnpm check
          pnpm api:export
          git diff --exit-code docs/openapi.json
      - name: Create disposable credentials and start PostgreSQL
        run: |
          node scripts/prepare-ci-env.mjs
          pnpm infra:up
          pnpm db:migrate
          pnpm db:seed
      - name: PostgreSQL and API integration tests
        run: pnpm test:integration
      - name: Browser integration
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Stop test services
        if: always()
        run: docker compose --env-file .env -f infra/docker/compose.yml down
